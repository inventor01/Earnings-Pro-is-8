name: Backend Smoke

on:
  push:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-smoke.yml"

permissions:
  contents: read

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Smoke-test /go and beta queue
        env:
          DATABASE_URL: sqlite:////tmp/earnings-ninja-ci.db
          JWT_SECRET_KEY: ci-only-not-a-secret
          PUBLIC_APP_URL: http://localhost:8000
          RESEND_API_KEY: ""
          ALLOW_EPHEMERAL_SQLITE: "1"
          BETA_INVITE_CRON_TOKEN: "ci-beta-cron-token"
          CREATIVE_OS_TOKEN: "ci-creative-token"
        run: |
          python - <<'PY'
          from sqlalchemy import inspect
          from fastapi.testclient import TestClient

          from backend.app import app
          from backend.db import engine

          routes = {getattr(route, "path", None) for route in app.routes}
          assert "/go" in routes, "missing /go route"

          # FastAPI 0.138/Starlette 1.3 may not flatten included APIRouter
          # paths into app.routes for introspection, so verify the router itself
          # and then exercise the endpoints over HTTP below.
          from backend.routers import waitlist_routes
          waitlist_paths = {getattr(r, "path", None) for r in waitlist_routes.router.routes}
          required_waitlist_paths = {
              "/api/waitlist/android-beta",
              "/api/waitlist/android-beta/approve-page",
              "/api/waitlist/android-beta/approve",
              "/api/waitlist/android-beta/process-invites",
              "/api/waitlist/event",
          }
          missing_waitlist = required_waitlist_paths - waitlist_paths
          assert not missing_waitlist, f"missing waitlist routes: {sorted(missing_waitlist)}"

          tables = set(inspect(engine).get_table_names())
          required_tables = {"android_beta_tester_signups", "growth_events", "creative_content_jobs"}
          missing_tables = required_tables - tables
          assert not missing_tables, f"missing tables: {sorted(missing_tables)}"

          client = TestClient(app)

          creative_page = client.get("/creative")
          assert creative_page.status_code == 200, creative_page.text
          assert "Ninja Creative OS" in creative_page.text

          unauth_creative = client.get("/api/creative/summary")
          assert unauth_creative.status_code == 401, unauth_creative.text

          auth_headers = {"Authorization": "Bearer ci-creative-token"}
          create_job = client.post(
              "/api/creative/jobs",
              headers=auth_headers,
              json={
                  "content_id": "EN-N-0001",
                  "page": "ninja",
                  "status": "needs_approval",
                  "title": "Ninja waits at pickup counter",
                  "hook": "The most patient delivery driver alive.",
                  "virality_score": 9,
                  "ninja_fit_score": 10,
                  "simplicity_score": 9,
                  "originality_score": 8,
                  "cost_efficiency_score": 9,
                  "brand_fit_score": 7,
              },
          )
          assert create_job.status_code == 200, create_job.text
          creative_job = create_job.json()
          assert creative_job["scores"]["total"] is not None
          job_id = creative_job["id"]

          summary = client.get("/api/creative/summary", headers=auth_headers)
          assert summary.status_code == 200, summary.text
          assert summary.json()["by_status"]["needs_approval"] == 1

          approved = client.post(f"/api/creative/jobs/{job_id}/approve", headers=auth_headers)
          assert approved.status_code == 200, approved.text
          assert approved.json()["status"] == "approved"

          page = client.get("/go")
          assert page.status_code == 200, page.text
          assert "Know what you actually made." in page.text
          assert "/api/waitlist/android-beta" in page.text
          assert "approximately one hour" in page.text.lower()
          assert "play.google.com/apps/testing" not in page.text.lower()

          payload = {
              "email": "ci-android-tester@example.com",
              "first_name": "CI",
              "platforms": ["DoorDash", "Uber Eats"],
              "consent": True,
              "source": "ci",
              "video_id": "V001",
              "format_id": "offer-choice",
              "campaign_id": "smoke",
          }
          first = client.post("/api/waitlist/android-beta", json=payload)
          assert first.status_code == 200, first.text
          assert first.json().get("success") is True

          duplicate = client.post("/api/waitlist/android-beta", json=payload)
          assert duplicate.status_code == 200, duplicate.text
          assert duplicate.json() == first.json()

          # The delayed invite processor is private. A missing/wrong token must
          # never expose or advance the tester queue.
          unauth_process = client.post(
              "/api/waitlist/android-beta/process-invites",
              headers={"Authorization": "Bearer wrong-token"},
          )
          assert unauth_process.status_code == 401, unauth_process.text

          no_consent = client.post(
              "/api/waitlist/android-beta",
              json={**payload, "email": "ci-no-consent@example.com", "consent": False},
          )
          assert no_consent.status_code == 422, no_consent.text

          event = client.post(
              "/api/waitlist/event",
              json={
                  "event_type": "landing_view",
                  "device": "desktop",
                  "source": "ci",
                  "video_id": "V001",
                  "format_id": "offer-choice",
                  "campaign_id": "smoke",
              },
          )
          assert event.status_code == 200, event.text
          assert event.json().get("success") is True

          bad_event = client.post(
              "/api/waitlist/event",
              json={"event_type": "made_up_event", "device": "desktop"},
          )
          assert bad_event.status_code == 422, bad_event.text
          PY
